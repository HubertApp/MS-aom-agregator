[project]
name = "ms-aom-agregator"
version = "0.1.0"
description = "Microservice d'agregation de données statiques sur les apis des autorités organisatrices de mobilité"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "async>=0.6.2",
    "fastapi>=0.126.0",
    "faststream[rabbit]>=0.6.5",
    "httpx>=0.28.1",
    "motor>=3.7.1",
    "pydantic-settings>=2.12.0",
    "ruff>=0.14.10",
    "strawberry-graphql[fastapi]>=0.288.1",
    "uvicorn>=0.40.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-logging==0.65b0",
    "opentelemetry-instrumentation-system-metrics==0.65b0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mongomock-motor>=0.0.36",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
