name: CI

on:
  push:
  pull_request:

# Un nouveau push sur une branche déjà en cours de test annule le run précédent,
# pour ne pas empiler les jobs sur une série de commits rapprochés.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked échoue si uv.lock n'est plus cohérent avec pyproject.toml :
      # ça évite qu'une dépendance ajoutée sans relock passe inaperçue.
      # uv installe au passage la version de Python fixée par .python-version.
      - name: Installer les dépendances
        run: uv sync --group dev --locked

      - name: Lint
        run: uv run ruff check .

      # La suite tourne hors ligne (MongoDB est simulé en mémoire), donc aucun
      # service ni conteneur n'est nécessaire ici.
      - name: Tests
        run: >
          uv run pytest -q
          --cov=app.services
          --cov=app.models
          --cov-report=term-missing
          --cov-fail-under=85

  # L'image ne part sur le registre que si le job ci-dessus est vert (needs) et
  # seulement depuis main et develop : une branche de travail ne publie rien.
  build-and-push:
    name: Docker build & push
    needs: tests
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # L'étiquette :<sha> est ce qui rend un retour arrière possible : chaque
      # image reste rattachée de façon immuable à son commit. Le nom d'image est
      # propre à CE service — le recopier d'un autre dépôt écraserait son image.
      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ms-aom-agregator:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ms-aom-agregator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
