# Les noms de service sont volontairement uniques : Compose ajoute toujours le
# nom de service comme alias DNS, et MS-Admin déclare aussi « mongodb » et
# « app » sur hubert-network. Deux conteneurs partageant un alias, c'est une
# résolution en round-robin, donc des erreurs intermittentes très trompeuses.
services:
  mongodb-aom:
    container_name: mongodb-aom-agregator
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: "mongouser"
      MONGO_INITDB_ROOT_PASSWORD: "mongopassword"
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27002:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - hubert-network

  aom-agregator-api:
    build: .
    container_name: service-aom-agregator
    labels:
      logging: "enabled"
      service: "service-aom-agregator"
    ports:
      - "8002:80"
    volumes:
      - .:/project
    command: "uvicorn app.main:app --host 0.0.0.0 --port 80 --reload --reload-dir /project"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - DATABASE_URL=mongodb://mongouser:mongopassword@mongodb-aom-agregator:27017
      - PYTHONUNBUFFERED=1
      - OTEL_SERVICE_NAME=service-aom-agregator
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      mongodb-aom:
        condition: service_healthy
    networks:
      - hubert-network

  worker:
    build: .
    container_name: ms-aom-agregator-worker
    labels:
      logging: "enabled"
      service: "aom-agregator-worker"
    volumes:
      - .:/project
    command: python -m app.run_worker
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - DATABASE_URL=mongodb://mongouser:mongopassword@mongodb-aom-agregator:27017
      - PYTHONUNBUFFERED=1
      - OTEL_SERVICE_NAME=aom-agregator-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      mongodb-aom:
        condition: service_healthy
    networks:
      - hubert-network

volumes:
  mongodb_data:

networks:
  hubert-network:
    external: true