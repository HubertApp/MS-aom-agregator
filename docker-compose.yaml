services:
  broker:
    container_name: rabbitmq-aom-agregator
    image: rabbitmq:management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-user}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-password}"
      RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE:?set in .env}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q "check_port_connectivity"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - ms-aom-agregator-network

  mongodb:
    container_name: mongodb-hubbert
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: "mongouser"
      MONGO_INITDB_ROOT_PASSWORD: "mongopassword"
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - ms-aom-agregator-network

  app:
    build: .
    container_name: ms-aom-agregator-api
    ports:
      - "8002:80"
    volumes:
      - .:/project
    command: "uvicorn app.main:app --host 0.0.0.0 --port 80 --reload --reload-dir /project"
    environment:
      - RABBITMQ_URL=amqp://user:password@broker:5672
      - DATABASE_URL=mongodb://mongouser:mongopassword@mongodb:27017
    depends_on:
      broker:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - ms-aom-agregator-network

  worker:
    build: .
    container_name: ms-aom-agregator-worker
    volumes:
      - .:/project
    command: python -m app.run_worker
    environment:
      - RABBITMQ_URL=amqp://user:password@broker:5672
      - DATABASE_URL=mongodb://mongouser:mongopassword@mongodb:27017
    depends_on:
      broker:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - ms-aom-agregator-network

volumes:
  rabbitmq_data:
  mongodb_data:

networks:
  ms-aom-agregator-network:
    driver: bridge
